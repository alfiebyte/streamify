name: CI

on:
  pull_request:
    branches: [production]
  push:
    branches: [production]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run test
      - run: npm run build